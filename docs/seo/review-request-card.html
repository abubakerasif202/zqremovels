  .qr { width:52mm; height:52mm; margin:3mm 0; border:0.4mm solid var(--ink); padding:2mm; }
  .qr svg { width:100%; height:100%; display:block; }
  .scan { font-weight:700; font-size:4mm; color: var(--ink); margin-bottom:2mm; }
  .contact { margin-top:auto; font-size:3.4mm; color: var(--muted); }
  .contact strong { color: var(--ink); }
  @media print { body { background: none; } .card { margin:0; box-shadow:none; } }
