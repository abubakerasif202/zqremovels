name: Dependency security remediation

on:
  push:
    branches:
      - security/dependency-alerts-2026-09-28

permissions:
  contents: read

jobs:
  audit-fix-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install clean dependency graph
        run: npm ci

      - name: Audit before
        run: npm audit --json > audit-before.json || true

      - name: Apply non-breaking transitive fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Upgrade vulnerable direct dependencies
        run: |
          npm install astro@7.3.5 sharp@0.35.5 --save
          npm install @lhci/cli@0.12.0 --save-dev

      - name: Audit candidate
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-before.json', 'audit-after.json']) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(file, JSON.stringify(audit.metadata?.vulnerabilities ?? null));
            for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
              console.log(name, v.severity, v.isDirect ? 'direct' : 'transitive', JSON.stringify(v.fixAvailable));
            }
          }
          const after = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          if ((after.metadata?.vulnerabilities?.total || 0) !== 0) {
            console.error('Candidate still contains dependency vulnerabilities.');
            process.exit(1);
          }
          NODE

      - name: Show candidate dependency diff
        run: |
          git diff -- package.json package-lock.json
          git status --short package.json package-lock.json

      - name: Clean reinstall candidate
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full tests
        run: npm test

      - name: SEO validation
        run: npm run seo:validate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lighthouse CI compatibility
        run: npm run lhci

      - name: Upload validated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-candidate
          path: |
            audit-before.json
            audit-after.json
            package.json
            package-lock.json
