name: Dependency security remediation

on:
  push:
    branches:
      - security/dependency-alerts-2026-09-28

permissions:
  contents: read

jobs:
  audit-fix-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install clean dependency graph
        run: npm ci

      - name: Audit before
        run: npm audit --json > audit-before.json || true

      - name: Apply non-breaking transitive fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Replace vulnerable direct dependency set
        run: |
          npm uninstall @lhci/cli --save-dev
          npm install lighthouse@13.5.0 --save-dev
          npm install astro@7.3.5 sharp@0.35.5 --save
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Require zero known npm vulnerabilities
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-before.json', 'audit-after.json']) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(file, JSON.stringify(audit.metadata?.vulnerabilities ?? null));
            for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
              console.log(name, v.severity, v.isDirect ? 'direct' : 'transitive', JSON.stringify(v.fixAvailable));
            }
          }
          const after = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          if ((after.metadata?.vulnerabilities?.total || 0) !== 0) {
            console.error('Candidate still contains dependency vulnerabilities.');
            process.exit(1);
          }
          NODE

      - name: Show candidate dependency diff
        run: |
          git diff -- package.json package-lock.json
          git status --short package.json package-lock.json

      - name: Clean reinstall candidate
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full tests
        run: npm test

      - name: SEO validation
        run: npm run seo:validate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lighthouse compatibility smoke
        shell: bash
        run: |
          PORT=4173 node scripts/serve-site.mjs > /tmp/zq-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p lighthouse-reports
          for route in / /contact-us/ /removalists-adelaide/; do
            slug=$(printf '%s' "$route" | sed 's#^/##;s#/$##;s#/#-#g')
            [ -n "$slug" ] || slug=home
            npx lighthouse "http://127.0.0.1:4173$route"               --chrome-flags="--headless --no-sandbox"               --only-categories=performance,accessibility,seo               --output=json               --output-path="lighthouse-reports/$slug.json"               --quiet
          done
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          let failed = false;
          for (const file of fs.readdirSync('lighthouse-reports').filter(f => f.endsWith('.json'))) {
            const lhr = JSON.parse(fs.readFileSync(path.join('lighthouse-reports', file), 'utf8'));
            const p = lhr.categories.performance.score;
            const a = lhr.categories.accessibility.score;
            const s = lhr.categories.seo.score;
            const cls = lhr.audits['cumulative-layout-shift']?.numericValue;
            const lcp = lhr.audits['largest-contentful-paint']?.numericValue;
            const tbt = lhr.audits['total-blocking-time']?.numericValue;
            const ttfb = lhr.audits['server-response-time']?.numericValue;
            console.log(file, {performance:p, accessibility:a, seo:s, cls, lcp, tbt, ttfb});
            if (s < 0.9) { console.error(file, 'SEO score below 0.90'); failed = true; }
            if (p < 0.9) console.warn(file, 'performance score below 0.90');
            if (a < 0.9) console.warn(file, 'accessibility score below 0.90');
            if (cls > 0.1) console.warn(file, 'CLS above 0.1');
            if (lcp > 2500) console.warn(file, 'LCP above 2500ms');
            if (tbt > 200) console.warn(file, 'TBT above 200ms');
            if (ttfb > 800) console.warn(file, 'TTFB above 800ms');
          }
          if (failed) process.exit(1);
          NODE

      - name: Upload validated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-candidate
          path: |
            audit-before.json
            audit-after.json
            package.json
            package-lock.json
            lighthouse-reports/
