name: Dependency security remediation

on:
  push:
    branches:
      - security/dependency-alerts-2026-09-28

permissions:
  contents: write

jobs:
  audit-fix-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install clean dependency graph
        run: npm ci

      - name: Audit before
        run: npm audit --json > audit-before.json || true

      - name: Apply safe transitive fixes and patched direct dependencies
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm uninstall @lhci/cli --save-dev
          npm install lighthouse@13.5.0 --save-dev
          npm install astro@7.3.5 sharp@0.35.5 --save
          npm audit fix --package-lock-only --ignore-scripts || true
          npm pkg set scripts.lhci="node scripts/lighthouse-audit.mjs"

      - name: Require zero known npm vulnerabilities
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('audit-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          console.log('AUDIT_BEFORE', JSON.stringify(before.metadata?.vulnerabilities ?? null));
          console.log('AUDIT_AFTER', JSON.stringify(after.metadata?.vulnerabilities ?? null));
          if ((after.metadata?.vulnerabilities?.total || 0) !== 0) {
            for (const [name, v] of Object.entries(after.vulnerabilities || {})) {
              console.error(name, v.severity, v.isDirect ? 'direct' : 'transitive', JSON.stringify(v.fixAvailable));
            }
            process.exit(1);
          }
          NODE

      - name: Dependency diff
        run: |
          git diff -- package.json package-lock.json
          git diff --check

      - name: Clean reinstall
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full tests
        run: npm test

      - name: SEO validation
        run: npm run seo:validate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lighthouse audit
        run: npm run lhci

      - name: Commit validated dependency manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests already match the validated secure graph."
          else
            git commit -m "fix(deps): resolve GitHub dependency alerts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-final
          path: |
            audit-before.json
            audit-after.json
            tmp/lighthouse-reports/
