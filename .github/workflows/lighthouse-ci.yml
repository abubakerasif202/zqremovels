name: Lighthouse CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run regression tests
        run: npm test

      - name: Rebuild without test fixture environment
        run: npm run build

      - name: Validate SEO and internal assets
        run: npm run seo:validate

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Verify responsive and conversion journeys
        run: npx playwright test --workers=2 --reporter=line

      - name: Run Lighthouse CI
        run: npm run lhci
